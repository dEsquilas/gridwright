<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs><clipPath id="win"><rect x="0" y="0" width="900" height="598" rx="11"/></clipPath>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
  </filter></defs>
  <g clip-path="url(#win)" filter="url(#shadow)">
    <rect x="0" y="0" width="900" height="598" fill="#1d1f21"/>
    <rect x="0" y="0" width="900" height="38" fill="#2f3134"/>
  <circle cx="22" cy="19.0" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19.0" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19.0" r="6" fill="#28c840"/>
    <text x="450.0" y="23.0" font-size="12" fill="#b9b9b9" text-anchor="middle">Three layers</text>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#000" stroke-opacity=".35"/>
    <g transform="translate(0 38)">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c8c8c"/>
    </marker>
  </defs>

  <!-- SHELL -->
  <rect x="60" y="36" width="780" height="112" rx="10" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="84" y="66" font-size="12" font-weight="700" fill="#c58af9" letter-spacing="1.2">SHELL</text>
  <text x="152" y="66" font-size="14" font-weight="600" fill="#e6e6e6">Claude Code plugin</text>
  <text x="84" y="92" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2c2c2">commands/   skills/   hooks/   .mcp.json</text>
  <text x="84" y="120" font-size="12.5" fill="#9a9a9a">Thin, no logic. It only teaches the protocol: ask the CLI, do the work, report back.</text>

  <line x1="450" y1="148" x2="450" y2="188" stroke="#8c8c8c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ENGINE -->
  <rect x="60" y="190" width="780" height="222" rx="10" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="84" y="220" font-size="12" font-weight="700" fill="#5ac8fa" letter-spacing="1.2">ENGINE</text>
  <text x="160" y="220" font-size="14" font-weight="600" fill="#e6e6e6">the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gw</tspan> CLI — TypeScript / Node</text>
  <text x="646" y="220" font-size="12" fill="#33c85a">■</text>
  <text x="660" y="220" font-size="11.5" fill="#9a9a9a">six packages, all built</text>

  <rect x="84" y="238" width="176" height="56" rx="7" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5"/>
  <text x="98" y="262" font-size="12.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">core</text>
  <text x="98" y="280" font-size="11" fill="#9a9a9a">state machine · IR types</text>

  <rect x="272" y="238" width="176" height="56" rx="7" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5"/>
  <text x="286" y="262" font-size="12.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">figma</text>
  <text x="286" y="280" font-size="11" fill="#9a9a9a">API · distill · assets</text>

  <rect x="460" y="238" width="176" height="56" rx="7" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5"/>
  <text x="474" y="262" font-size="12.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">cli</text>
  <text x="474" y="280" font-size="11" fill="#9a9a9a">the gw binary</text>

  <rect x="648" y="238" width="168" height="56" rx="7" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5"/>
  <text x="662" y="262" font-size="12.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">tokens</text>
  <text x="662" y="280" font-size="11" fill="#9a9a9a">ΔE match · write-back</text>

  <rect x="84" y="308" width="176" height="56" rx="7" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5"/>
  <text x="98" y="332" font-size="12.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">library</text>
  <text x="98" y="350" font-size="11" fill="#9a9a9a">registry · placements</text>

  <rect x="272" y="308" width="176" height="56" rx="7" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5"/>
  <text x="286" y="332" font-size="12.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">verify</text>
  <text x="286" y="350" font-size="11" fill="#9a9a9a">Playwright · metrics</text>

  <rect x="460" y="308" width="356" height="56" rx="7" fill="#1d1f21" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="474" y="332" font-size="11.5" fill="#8c8c8c">The adapters live inside <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#9a9a9a">verify</tspan>'s harness,</text>
  <text x="474" y="350" font-size="11.5" fill="#8c8c8c">the dashboard inside <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#9a9a9a">cli</tspan>. Neither earned a package.</text>

  <text x="84" y="392" font-size="12.5" fill="#9a9a9a">The adapter boundary is sacred: it owns the file shape and the mount code, never the IR or the state machine.</text>

  <line x1="270" y1="412" x2="270" y2="452" stroke="#8c8c8c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="670" y1="412" x2="670" y2="452" stroke="#8c8c8c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- OUTPUTS -->
  <rect x="60" y="454" width="420" height="76" rx="10" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="84" y="480" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">.gridwright/</text>
  <text x="84" y="502" font-size="11.5" fill="#9a9a9a">runs/ state · IR · screenshots  —  scaffolding, gitignored</text>
  <text x="84" y="519" font-size="11.5" fill="#9a9a9a">baselines/ golden tests  —  committed</text>

  <rect x="500" y="454" width="340" height="76" rx="10" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="524" y="480" font-size="13" font-weight="600" fill="#e6e6e6">the consuming project</text>
  <text x="524" y="502" font-size="11.5" fill="#9a9a9a">components · design tokens · regression tests</text>
  <text x="524" y="519" font-size="11.5" fill="#9a9a9a">every run leaves more of all three</text>
</g>
  </g>
  <rect x=".5" y=".5" width="899" height="597" rx="11" fill="none" stroke="#000" stroke-opacity=".35"/>
</svg>
