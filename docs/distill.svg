<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900" height="458" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs><clipPath id="win"><rect x="0" y="0" width="900" height="458" rx="11"/></clipPath>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
  </filter></defs>
  <g clip-path="url(#win)" filter="url(#shadow)">
    <rect x="0" y="0" width="900" height="458" fill="#1d1f21"/>
    <rect x="0" y="0" width="900" height="38" fill="#2f3134"/>
  <circle cx="22" cy="19.0" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19.0" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19.0" r="6" fill="#28c840"/>
    <text x="450.0" y="23.0" font-size="12" fill="#b9b9b9" text-anchor="middle">Why the IR exists</text>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#000" stroke-opacity=".35"/>
    <g transform="translate(0 38)">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c8c8c"/>
    </marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff6b6b"/>
    </marker>
  </defs>
  <text x="40" y="64" font-size="12.5" fill="#9a9a9a">Feeding the raw tree to the model is not just expensive. It produces worse code.</text>

  <!-- raw -->
  <rect x="40" y="96" width="248" height="150" rx="9" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="64" y="124" font-size="13.5" font-weight="600" fill="#e6e6e6">Raw Figma tree</text>
  <text x="64" y="150" font-size="12" fill="#9a9a9a">2,000–5,000 nodes</text>
  <text x="64" y="170" font-size="12" fill="#9a9a9a">absolute coordinates</text>
  <text x="64" y="190" font-size="12" fill="#9a9a9a">nested fills, constraints, effects</text>
  <text x="64" y="220" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">~312 KB</text>

  <!-- distill -->
  <path d="M292 171 L332 171" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="336" y="140" width="130" height="62" rx="9" fill="#1b2a38" stroke="#5ac8fa" stroke-width="1.5"/>
  <text x="401" y="167" font-size="13.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6" text-anchor="middle">distill</text>
  <text x="401" y="186" font-size="11" fill="#9a9a9a" text-anchor="middle">deterministic</text>
  <path d="M470 171 L510 171" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- IR -->
  <rect x="514" y="96" width="248" height="150" rx="9" fill="#172a1e" stroke="#33c85a" stroke-width="1.5"/>
  <text x="538" y="124" font-size="13.5" font-weight="600" fill="#e6e6e6">The IR</text>
  <text x="538" y="150" font-size="12" fill="#c2c2c2">~120 lines, semantic</text>
  <text x="538" y="170" font-size="12" fill="#c2c2c2">roles, slots, resolved layout</text>
  <text x="538" y="190" font-size="12" fill="#c2c2c2">this is what the model reads</text>
  <text x="538" y="220" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#33c85a">~4 KB</text>

  <text x="786" y="164" font-size="26" font-weight="700" fill="#33c85a">99%</text>
  <text x="786" y="184" font-size="11.5" fill="#9a9a9a">smaller</text>

  <!-- isomorphisms -->
  <rect x="40" y="278" width="418" height="106" rx="9" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="64" y="304" font-size="12.5" font-weight="600" fill="#e6e6e6">Two isomorphisms, not heuristics</text>
  <text x="64" y="330" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5ac8fa">auto-layout</text>
  <text x="154" y="330" font-size="12" fill="#9a9a9a">→</text>
  <text x="174" y="330" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5ac8fa">flex-col gap-6</text>
  <text x="64" y="350" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5ac8fa">variants</text>
  <text x="154" y="350" font-size="12" fill="#9a9a9a">→</text>
  <text x="174" y="350" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5ac8fa">props</text>
  <text x="64" y="372" font-size="11.5" fill="#9a9a9a">Side effect: it cannot emit margins between siblings.</text>

  <!-- halt -->
  <rect x="478" y="278" width="382" height="106" rx="9" fill="#301c1c" stroke="#f0bcbc" stroke-width="1.5"/>
  <text x="502" y="304" font-size="12.5" font-weight="600" fill="#e6e6e6">No auto-layout → it halts</text>
  <text x="502" y="332" font-size="11.5" fill="#9a9a9a">If the design was positioned by hand there is no</text>
  <text x="502" y="349" font-size="11.5" fill="#9a9a9a">layout to infer. A better prompt will not fix that.</text>
  <text x="502" y="370" font-size="11.5" font-weight="600" fill="#ff8a8a">It gets fixed in Figma.</text>
</g>
  </g>
  <rect x=".5" y=".5" width="899" height="457" rx="11" fill="none" stroke="#000" stroke-opacity=".35"/>
</svg>
