<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs><clipPath id="win"><rect x="0" y="0" width="900" height="468" rx="11"/></clipPath>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
  </filter></defs>
  <g clip-path="url(#win)" filter="url(#shadow)">
    <rect x="0" y="0" width="900" height="468" fill="#1d1f21"/>
    <rect x="0" y="0" width="900" height="38" fill="#2f3134"/>
  <circle cx="22" cy="19.0" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19.0" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19.0" r="6" fill="#28c840"/>
    <text x="450.0" y="23.0" font-size="12" fill="#b9b9b9" text-anchor="middle">The control loop</text>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#000" stroke-opacity=".35"/>
    <g transform="translate(0 38)">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c8c8c"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5bd4f"/>
    </marker>
  </defs>
  <text x="40" y="64" font-size="12.5" fill="#9a9a9a">Claude does not decide which stage comes next. It asks. The order is not persuasion — it is control flow.</text>

  <!-- 1 -->
  <rect x="40" y="96" width="188" height="96" rx="9" fill="#1b2a38" stroke="#5ac8fa" stroke-width="1.5"/>
  <circle cx="62" cy="118" r="10" fill="#5ac8fa"/>
  <text x="62" y="122" font-size="11" font-weight="700" fill="#26282b" text-anchor="middle">1</text>
  <text x="80" y="123" font-size="13.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">gw next</text>
  <text x="58" y="150" font-size="11.5" fill="#c2c2c2">The CLI reads state.json and</text>
  <text x="58" y="167" font-size="11.5" fill="#c2c2c2">returns the directive:</text>
  <text x="58" y="183" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#9a9a9a">{stage, actor, inputs, gate}</text>

  <line x1="230" y1="144" x2="268" y2="144" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2 -->
  <rect x="270" y="96" width="188" height="96" rx="9" fill="#2a2338" stroke="#c58af9" stroke-width="1.5"/>
  <circle cx="292" cy="118" r="10" fill="#c58af9"/>
  <text x="292" y="122" font-size="11" font-weight="700" fill="#26282b" text-anchor="middle">2</text>
  <text x="310" y="123" font-size="13.5" font-weight="600" fill="#e6e6e6">Claude works</text>
  <text x="288" y="150" font-size="11.5" fill="#c2c2c2">The creative part only: reads</text>
  <text x="288" y="167" font-size="11.5" fill="#c2c2c2">the IR, writes the component</text>
  <text x="288" y="184" font-size="11.5" fill="#c2c2c2">the way this repo writes them.</text>

  <line x1="460" y1="144" x2="498" y2="144" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="500" y="96" width="188" height="96" rx="9" fill="#1b2a38" stroke="#5ac8fa" stroke-width="1.5"/>
  <circle cx="522" cy="118" r="10" fill="#5ac8fa"/>
  <text x="522" y="122" font-size="11" font-weight="700" fill="#26282b" text-anchor="middle">3</text>
  <text x="540" y="123" font-size="13.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">gw verify</text>
  <text x="518" y="150" font-size="11.5" fill="#c2c2c2">Renders and measures the</text>
  <text x="518" y="167" font-size="11.5" fill="#c2c2c2">three dimensions on every</text>
  <text x="518" y="184" font-size="11.5" fill="#c2c2c2">viewport. Worst one wins.</text>

  <line x1="690" y1="144" x2="712" y2="144" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4 — wider than the others: its two lines are prose, not a label. -->
  <rect x="716" y="96" width="144" height="96" rx="9" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <circle cx="738" cy="118" r="10" fill="#8c8c8c"/>
  <text x="738" y="122" font-size="11" font-weight="700" fill="#26282b" text-anchor="middle">4</text>
  <text x="756" y="123" font-size="13.5" font-weight="600" fill="#e6e6e6">score</text>
  <text x="734" y="152" font-size="11.5" fill="#33c85a">evidence, not a gate</text>
  <text x="734" y="176" font-size="11.5" fill="#f5bd4f">the person decides</text>

  <!-- feedback -->
  <path d="M788 194 L788 232 L364 232 L364 196" fill="none" stroke="#f5bd4f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <rect x="452" y="216" width="256" height="32" rx="6" fill="#33291a" stroke="#f0d9b5" stroke-width="1"/>
  <text x="580" y="237" font-size="11.5" fill="#f5bd4f" text-anchor="middle">refine --focus=structural · hard cap of 4</text>

  <!-- state -->
  <rect x="40" y="278" width="820" height="80" rx="9" fill="#26282b" stroke="#3a3d41" stroke-width="1.5"/>
  <text x="64" y="306" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">.gridwright/runs/&lt;id&gt;/state.json</text>
  <text x="64" y="328" font-size="12" fill="#9a9a9a">The single source of truth. Survives interruptions, compaction and restarts.</text>
  <text x="64" y="347" font-size="12" fill="#9a9a9a">Closing a stage that is not the current one throws. The three mandatory ones cannot be skipped at all.</text>


  <text x="40" y="392" font-size="12.5" fill="#9a9a9a">There is no way to jump to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6e6e6">golden</tspan> without verifying first, because the CLI will not allow it — not because the prompt asked nicely.</text>
</g>
  </g>
  <rect x=".5" y=".5" width="899" height="467" rx="11" fill="none" stroke="#000" stroke-opacity=".35"/>
</svg>
